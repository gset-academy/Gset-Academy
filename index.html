<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSET Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg-deep: #0C1B1D;
    --bg-panel: #142B2A;
    --bg-panel-raised: #1B3634;
    --line: rgba(242, 239, 228, 0.10);
    --line-strong: rgba(242, 239, 228, 0.22);
    --gold: #D1A13E;
    --gold-soft: rgba(209, 161, 62, 0.16);
    --paper: #F2EFE4;
    --muted: #93ABA3;
    --error: #C9695C;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background-color: var(--bg-deep);
    background-image:
      repeating-radial-gradient(circle at 18% 24%, transparent 0, transparent 38px, rgba(242,239,228,0.030) 39px, transparent 40px),
      repeating-radial-gradient(circle at 84% 78%, transparent 0, transparent 52px, rgba(242,239,228,0.024) 53px, transparent 54px);
    color: var(--paper);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }

  .scene {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 22px 28px;
    border-bottom: 1px solid var(--line);
  }

  .logo-mark {
    height: 40px;
    width: auto;
    display: block;
  }

  .wordmark-suffix {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 0.01em;
  }

  main {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 64px;
  }

  /* ---------- Login view ---------- */

  #login-view {
    width: 100%;
    max-width: 420px;
    margin-top: 6vh;
  }

  .login-card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 40px 34px;
    animation: riseIn 0.5s ease-out;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .login-card { animation: none; }
  }

  .headline {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 27px;
    line-height: 1.15;
    margin: 0 0 10px;
  }

  .subcopy {
    font-size: 15px;
    line-height: 1.55;
    color: var(--muted);
    margin: 0 0 26px;
    max-width: 32ch;
  }

  #g_id_signin { margin-bottom: 26px; }

  .coord-mark {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }

  .coord-value {
    font-size: 12.5px;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  .coord-place {
    font-size: 12.5px;
    color: var(--muted);
  }

  #status-line {
    margin-top: 22px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    min-height: 20px;
  }

  #status-line.is-error { color: var(--error); }

  /* ---------- Content view ---------- */

  #content-view {
    width: 100%;
    max-width: 720px;
  }

  .welcome-bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 30px;
  }

  .welcome-bar .hello {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
  }

  .course-badge {
    align-self: flex-start;
    font-size: 13px;
    color: var(--gold);
    background: var(--gold-soft);
    border: 1px solid rgba(209, 161, 62, 0.3);
    border-radius: 5px;
    padding: 4px 10px;
  }

  .video-card {
    position: relative;
    background: var(--bg-panel-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .video-card__index {
    position: absolute;
    top: 12px;
    right: 18px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1;
    color: transparent;
    -webkit-text-stroke: 1px var(--line-strong);
    user-select: none;
  }

  .video-card__title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 17px;
    margin: 0 0 16px;
    max-width: 78%;
  }

  .video-frame {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    border-radius: 6px;
    overflow: hidden;
    background: #000;
  }

  .video-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .corner {
    position: absolute;
    width: 14px;
    height: 14px;
    z-index: 2;
    pointer-events: none;
    opacity: 0.9;
  }
  .corner.tl { top: 8px; left: 8px; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); }
  .corner.tr { top: 8px; right: 8px; border-top: 2px solid var(--gold); border-right: 2px solid var(--gold); }
  .corner.bl { bottom: 8px; left: 8px; border-bottom: 2px solid var(--gold); border-left: 2px solid var(--gold); }
  .corner.br { bottom: 8px; right: 8px; border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold); }

  .empty-note {
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.6;
  }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  @media (max-width: 480px) {
    .login-card { padding: 32px 24px; }
    .headline { font-size: 24px; }
  }
</style>
</head>

          <span class="coord-value">22.5726°N, 88.3639°E</span>
          <span class="coord-place">Kolkata</span>
        </div>
      </div>
      <p id="status-line"></p>
    </div>

    <div id="content-view" style="display:none;">
      <div class="welcome-bar">
        <p class="hello" id="hello-text"></p>
        <span class="course-badge" id="course-badge"></span>
      </div>
      <div id="videos-container"></div>
    </div>

  </main>
</div>

<script>
  // ===== CONFIGURATION - replace with your own values =====
  const GOOGLE_CLIENT_ID = '611581015580-q23gi9smplqt7rabslfl36gs2m2cqmnt.apps.googleusercontent.com';
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby2VHcomhzbzrq7t6aF1Z7DF5a8eKHoiUzfYauP145FA4jvUCPn-bDFgobgDQq8gP4m/exec';

  const statusLine = document.getElementById('status-line');

  window.onload = function () {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleCredentialResponse
    });
    google.accounts.id.renderButton(
      document.getElementById('g_id_signin'),
      { theme: 'filled_black', size: 'large', text: 'signin_with', shape: 'rectangular', width: '320' }
    );
  };

  function setStatus(text, isError) {
    statusLine.textContent = text || '';
    statusLine.classList.toggle('is-error', !!isError);
  }

  function handleCredentialResponse(response) {
    setStatus('Checking enrollment…', false);
    const idToken = response.credential;

    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = APPS_SCRIPT_URL + '?token=' + encodeURIComponent(idToken);
    document.body.appendChild(iframe);

    let settled = false;
    const timeoutId = setTimeout(() => {
      if (settled) return;
      settled = true;
      cleanup();
      setStatus('Something went wrong. Please try again.', true);
    }, 12000);

    function cleanup() {
      window.removeEventListener('message', onMessage);
      clearTimeout(timeoutId);
      if (iframe.parentNode) iframe.remove();
    }

    function onMessage(event) {
      const data = event.data;
      if (!data || typeof data.authorized === 'undefined') return; // onno message ignore korun
      if (settled) return;
      settled = true;
      cleanup();

      if (!data.authorized) {
        setStatus('No enrollment found for this account. Reach out to GSET Academy if you think this is a mistake.', true);
        return;
      }

      setStatus('', false);
      document.getElementById('login-view').style.display = 'none';

      document.getElementById('hello-text').textContent = 'Welcome back, ' + data.name;
      document.getElementById('course-badge').textContent = data.course;

      const container = document.getElementById('videos-container');

      if (!data.videos || data.videos.length === 0) {
        container.innerHTML = '<p class="empty-note">No recordings uploaded yet for your course. Check back after your next class.</p>';
      } else {
        data.videos.forEach((video, i) => {
          const videoId = extractYouTubeId(video.link);
          const index = String(i + 1).padStart(2, '0');

          const card = document.createElement('div');
          card.className = 'video-card';
          card.innerHTML =
            '<span class="video-card__index">' + index + '</span>' +
            '<h3 class="video-card__title">' + video.title + '</h3>' +
            '<div class="video-frame">' +
              '<span class="corner tl"></span><span class="corner tr"></span>' +
              '<span class="corner bl"></span><span class="corner br"></span>' +
              '<iframe src="https://www.youtube.com/embed/' + videoId + '" allowfullscreen></iframe>' +
            '</div>';
          container.appendChild(card);
        });
      }

      document.getElementById('content-view').style.display = 'block';
    }

    window.addEventListener('message', onMessage);
  }

  function extractYouTubeId(url) {
    const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&\n?#]+)/);
    return match ? match[1] : '';
  }
</script>
